<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUonE Event Display</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="panel">
  <details open>
  <summary>MUonE Event Display</summary>
  <p id="source" class="muted"></p>

  <section>
    <h2>Event</h2>
    <div class="row">
      <button id="prev" title="Previous event (←)">◀</button>
      <input type="number" id="eventNumber" min="0" step="1" list="eventIds" placeholder="number" aria-label="Event number">
      <button id="go" title="Show this event (Enter)">Go</button>
      <button id="next" title="Next event (→)">▶</button>
    </div>
    <datalist id="eventIds"></datalist>
    <button id="random" class="wide" title="Random event (R)">Random event</button>
    <!-- <label class="file">Or open a JSON file: <input type="file" id="file" accept=".json"></label> -->
  </section>

  <section>
    <h2>View</h2>
    <label>z compression: <span id="zval"></span>
      <input type="range" id="zscale" min="0.02" max="1" step="0.01" value="0.1"></label>
    <label><input type="checkbox" data-layer="geometry" checked> detector</label>
    <label><input type="checkbox" data-layer="hits" checked> hits (strips)</label>
    <label><input type="checkbox" data-layer="tracks" checked> tracks</label>
    <label><input type="checkbox" data-layer="vertices" checked> vertices</label>
    <div id="legend">
      <span class="sw" style="background:#58a6ff"></span>x
      <span class="sw" style="background:#3fb950"></span>y
      <span class="sw" style="background:#d29922"></span>u
      <span class="sw" style="background:#bc8cff"></span>v
    </div>
  </section>
  </details>
  <div id="info">loading…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
